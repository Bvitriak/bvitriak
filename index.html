<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#0c1a24">

    <title>Bvitriak</title>
    <meta name="description" content="Home of Bvitriak — an independent game reviewer and content creator. Explore my works, socials and certificates.">
    <meta name="keywords" content="bvitriak, game reviewer, gaming, video games, game analysis, portfolio, content creator">
    <meta name="author" content="bvitriak">

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">

    <meta property="og:title" content="Bvitriak">
    <meta property="og:description" content="Welcome to my profile, stranger! An independent game reviewer and content creator.">
    <meta property="og:image" content="https://example.com/img/bg/home-bg-poster.jpg">
    <meta property="og:url" content="https://example.com/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bvitriak">
    <meta name="twitter:description" content="Welcome to my profile, stranger! An independent game reviewer and content creator.">
    <meta name="twitter:image" content="https://example.com/img/bg/home-bg-poster.jpg">

    <link rel="icon" href="img/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">

    <!-- The intro hides the content until JS reveals it; without JS, show it. -->
    <noscript>
        <style>
            .home__title, .home__nav, .home__quote, .home__music {
                opacity: 1 !important;
                animation: none !important;
            }
        </style>
    </noscript>
</head>
<body>
<main class="home" id="home">
    <!-- Animated night-city background. Reduced-motion users get the static poster. -->
    <picture class="home__bg" aria-hidden="true">
        <source media="(prefers-reduced-motion: reduce)" srcset="img/bg/home-bg-poster.jpg">
        <source srcset="img/bg/home-bg.webp" type="image/webp">
        <img src="img/bg/home-bg-poster.jpg" alt="" width="1920" height="1080" fetchpriority="high" decoding="async">
    </picture>

    <h1 class="home__title">Welcome to my profile, stranger!</h1>

    <nav class="home__nav" aria-label="Primary">
        <a class="home__link" href="#about">About</a>
        <a class="home__link" href="#works">Works</a>
        <a class="home__link" href="#socials">Socials</a>
        <a class="home__link" href="#certificates">Certificates</a>
    </nav>

    <div class="home__foot">
        <p class="home__quote">God&rsquo;s in his heaven all&rsquo;s right with the world.</p>

        <button class="home__music" type="button" aria-pressed="false" aria-label="Toggle background music">
            <span class="home__music-text">music <span class="home__music-state">off</span></span>
        </button>
    </div>

    <!-- Optional background track. Add a file and uncomment the <source> to
         make the "music on" toggle actually play audio. -->
    <audio class="home__audio" loop preload="none">
        <!-- <source src="audio/theme.mp3" type="audio/mpeg"> -->
    </audio>
</main>

<script src="js/script.js"></script>
</body>
</html>
