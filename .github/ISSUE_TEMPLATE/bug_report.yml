name: Bug report
description: Report a problem with the portfolio site or repository.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. Open the page
        2. Select an option
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://example.com/
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone
